<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/signin.css">
</head>

<body>

    <div class="container">

        
        <form id="form" >
            <h1>Sign In</h1>

            <input type="email" id="in_signEmail" class="input_box" placeholder="Enter your Email" required>

            <input type="password" id="in_signPassword" class="input_box" placeholder="Enter your Password" required>

            <input type="submit" value="Sign In" id="submitSignIn">

        </form>
        <p id="signinError"></p>

    </div>

    <script src="../scripts/signin.js"></script>

</body>

</html>
