<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/signin.css">
    <link rel="icon" type="image/x-icon" href="../files/assets/logo_whitebg.png">

</head>

    
<body>

    <div class="container">


        <form id="form">
            <h1>Sign In</h1><br>

            <input type="email" id="in_signEmail" class="input_box" placeholder="Enter your Email" required>

            <input type="password" id="in_signPassword" class="input_box" placeholder="Enter your Password" required>

            <a href="../pages/signup.html">New User?</a>
            <a href="../pages/index.html">Stay Logged Out</a>
            <input type="submit" value="Sign In" id="submitSignIn">

        </form>
        <p id="signinError"></p>

        <div class="signin-doodles" aria-hidden="true">
            <img src="../files/assets/doodle/flying_plane_bw.png" class="doodle plane" alt="">
            <img src="../files/assets/doodle/book_bw.png" class="doodle book" alt="">
            <img src="../files/assets/doodle/light_bulb_bw.png" class="doodle bulb" alt="">
            <img src="../files/assets/doodle/formula_bw.png" class="doodle formula" alt="">
            <img src="../files/assets/doodle/light_bulb.png" class="doodle clrBulb" alt="">
        </div>
    </div>
    </div>

    <script src="../scripts/script.js"></script>
    <script src="../scripts/signin.js"></script>

</body>

</html>
