<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teachers:ital,wght@0,400..800;1,400..800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/signup.css">
</head>

<body>

    <div class="container">

        <form id="signUpForm">

            <!-- Heading -->
            <div class="form_group">
                <h1>Sign Up</h1>
            </div>

            <!-- Name -->
            <div class="form_group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" class="input_box" placeholder="Enter your full name"
                    autocomplete="name" required>
            </div>

            <!-- Email -->
            <div class="form_group">
                <label for="inEmail">Email Address</label>
                <input type="email" id="inEmail" class="input_box" placeholder="Enter your email" autocomplete="email"
                    required>
            </div>

            <!-- Username -->
            <div class="form_group">
                <label for="inUsername">Username</label>
                <input type="text" id="inUsername" class="input_box" placeholder="Choose a username"
                    autocomplete="username" required>

                <p id="usernameError"></p>
            </div>

            <!-- Phone -->
            <div class="form_group">
                <label for="inPhone">Phone Number</label>
                <input type="tel" id="inPhone" class="input_box" placeholder="Enter your phone number"
                    autocomplete="tel" required>
            </div>

            <!-- Password -->
            <div class="form_group">
                <label for="inPassword">Password</label>
                <input type="password" id="inPassword" class="input_box" placeholder="Create a strong password"
                    autocomplete="new-password" required>

                <p id="validPassword"></p>
            </div>

            <!-- Confirm Password -->
            <div class="form_group">
                <label for="inConfirm">Confirm Password</label>
                <input type="password" id="inConfirm" class="input_box" placeholder="Confirm your password"
                    autocomplete="new-password" required>

                <p id="unmatchedPassword"></p>
            </div>

            <!-- Role -->
            <div class="role_group">

                <label class="roleBox" for="admin">
                    <input type="radio" id="admin" name="role" value="Admin" checked>

                    <span>Admin</span>
                    <p>Full Access</p>
                </label>

                <label class="roleBox" for="user">
                    <input type="radio" id="user" name="role" value="User">

                    <span>User</span>
                    <p>Limited Access</p>
                </label>

            </div>

            <!-- Terms -->
            <div class="terms_group">

                <input type="checkbox" id="termsCheck">

                <label for="termsCheck">
                    I agree to
                    <a href="#" target="_blank">Terms of Service</a>
                    and
                    <a href="#" target="_blank">Privacy Policy</a>
                </label>

            </div>

            <!-- Submit -->
            <button type="submit" id="createAccountBtn">
                CREATE ACCOUNT
            </button>

        </form>

    </div>

    <script src="../scripts/signup.js"></script>

</body>

</html>
